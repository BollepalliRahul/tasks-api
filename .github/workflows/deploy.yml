name: Deploy to EC2

# This workflow runs automatically every time code is pushed to the
# main branch. It connects to our EC2 server and tells it to pull the
# latest code and rebuild the containers.
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd tasks-api
            git pull origin main
            sudo docker compose up -d --build
